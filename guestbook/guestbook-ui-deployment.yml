apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - image: gcr.io/google-samples/gb-frontend:v5
          name: guestbook-ui
          ports:
            - containerPort: 80
          volumeMounts:
            - name: pearc26-impasta-rw-pv
              mountPath: /data

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pearc26-impasta-rw-pv
